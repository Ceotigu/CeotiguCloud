<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEOTIGU CLOUD - CYBERPUNK DASHBOARD</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Rajdhani', sans-serif; }
        body { background: #030712; color: #00f3ff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Top Navigation Bar */
        header { 
            background: rgba(5, 8, 22, 0.95); 
            padding: 12px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid #00f3ff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            z-index: 10;
        }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 18px; text-shadow: 0 0 8px #00f3ff; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
        
        .btn { 
            background: transparent; 
            border: 1px solid #00f3ff; 
            color: #00f3ff; 
            padding: 8px 16px; 
            cursor: pointer; 
            font-family: 'Orbitron', sans-serif;
            font-weight: 700; 
            font-size: 11px;
            margin-left: 8px; 
            transition: all 0.2s;
            clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
        }
        .btn:hover { background: #00f3ff; color: #000; box-shadow: 0 0 12px #00f3ff; }
        .btn.purple { border-color: #bc13fe; color: #bc13fe; }
        .btn.purple:hover { background: #bc13fe; color: #fff; box-shadow: 0 0 12px #bc13fe; }

        /* Main Workspace */
        .main { display: flex; flex: 1; height: calc(100vh - 60px); }
        
        .sidebar { 
            width: 380px; 
            background: rgba(10, 15, 30, 0.95); 
            border-right: 1px solid rgba(0, 243, 255, 0.3); 
            padding: 20px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
        }
        
        .content { 
            flex: 1; 
            background: #03050c; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            padding: 40px; 
            text-align: center;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(188, 19, 254, 0.1) 0%, transparent 70%),
                linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 25px 25px, 25px 25px;
        }

        .mail-card { 
            background: rgba(255, 255, 255, 0.02); 
            border: 1px solid rgba(0, 243, 255, 0.3); 
            padding: 14px; 
            border-radius: 6px; 
            transition: 0.2s;
        }
        .mail-card:hover { border-color: #bc13fe; box-shadow: 0 0 10px rgba(188, 19, 254, 0.3); }
        .mail-address { font-family: monospace; color: #00f3ff; font-size: 13px; margin-bottom: 8px; word-break: break-all; }

        .cyber-panel {
            background: rgba(10, 15, 30, 0.85);
            border: 1px solid var(--neon-blue, #00f3ff);
            padding: 30px;
            border-radius: 10px;
            max-width: 520px;
            box-shadow: 0 0 20px rgba(0, 243, 255, 0.2);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body>

    <header>
        <h1>⚡ CEOTIGU CLOUD DASHBOARD</h1>
        <div>
            <button class="btn" onclick="addMail()">+ TẠO MAIL MỚI</button>
            <button class="btn purple" onclick="openVMOS()">💻 MỞ VMOS CLOUD</button>
        </div>
    </header>

    <div class="main">
        <div class="sidebar">
            <h3 style="font-family: 'Orbitron', sans-serif; font-size: 13px; color: #00f3ff; letter-spacing: 1px;">DANH SÁCH HÒM THƯ</h3>
            <div id="mailList"></div>
        </div>
        
        <div class="content">
            <div class="cyber-panel">
                <h2 style="font-family: 'Orbitron', sans-serif; margin-bottom: 12px; color: #00f3ff; font-size: 20px; text-shadow: 0 0 8px #00f3ff;">HỆ THỐNG ĐIỀU KHIỂN SẴN SÀNG</h2>
                <p style="font-size: 15px; color: #aaa; line-height: 1.6; margin-bottom: 25px;">
                    Các trang web quản lý thư từ và máy chủ đám mây có cơ chế chống nhúng khung hình (iframe). Toàn hãy quản lý danh sách bên trái, bấm <b>COPY</b> địa chỉ hoặc dùng nút bên dưới để mở hòm thư làm việc mượt mà nhất!
                </p>
                <button class="btn purple" style="padding: 12px 24px; font-size: 12px;" onclick="openTmailor()">🌐 MỞ TRANG TMAILOR TRỰC TIẾP</button>
            </div>
        </div>
    </div>

    <script>
        let mails = JSON.parse(localStorage.getItem('ceotigu_list')) || [
            'ceotigucloud1@tmailor.com',
            'ceotigucloud2@tmailor.com'
        ];

        function render() {
            const list = document.getElementById('mailList');
            list.innerHTML = '';
            mails.forEach((m, i) => {
                list.innerHTML += `
                    <div class="mail-card">
                        <div class="mail-address"><b>#${i + 1}:</b> ${m}</div>
                        <div style="display:flex; gap:6px;">
                            <button class="btn" style="padding:4px 8px; font-size:10px;" onclick="copyText('${m}')">COPY</button>
                            <button class="btn purple" style="padding:4px 8px; font-size:10px;" onclick="openTmailor()">MỞ WEB</button>
                            <button class="btn" style="padding:4px 8px; font-size:10px; border-color:#ff0055; color:#ff0055;" onclick="deleteMail(${i})">XÓA</button>
                        </div>
                    </div>`;
            });
            localStorage.setItem('ceotigu_list', JSON.stringify(mails));
        }

        function addMail() {
            const newMail = `ceotigucloud${mails.length + 1}@tmailor.com`;
            mails.push(newMail);
            render();
        }

        function deleteMail(index) {
            mails.splice(index, 1);
            render();
        }

        function copyText(txt) {
            navigator.clipboard.writeText(txt);
            alert('Đã copy: ' + txt);
        }

        function openTmailor() {
            window.open('https://tmailor.com/vi', '_blank');
        }

        function openVMOS() {
            window.open('https://cloud.vmos.com', '_blank');
        }

        render();
    </script>
</body>
</html>
