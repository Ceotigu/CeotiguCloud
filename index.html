<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEOTIGU CLOUD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: monospace; }
        body { background: #0a0a12; color: #00f3ff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        header { background: #121225; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #00f3ff; }
        h1 { font-size: 18px; text-shadow: 0 0 8px #00f3ff; }
        .btn { background: transparent; border: 1px solid #00f3ff; color: #00f3ff; padding: 6px 12px; cursor: pointer; font-weight: bold; margin-left: 5px; }
        .btn:hover { background: #00f3ff; color: #000; }
        .main { display: flex; flex: 1; height: calc(100vh - 50px); }
        .sidebar { width: 300px; background: #0f0f1d; border-right: 1px solid #00f3ff33; padding: 15px; overflow-y: auto; }
        .content { flex: 1; background: #05050a; position: relative; }
        iframe { width: 100%; height: 100%; border: none; }
        .mail-card { background: #181830; border: 1px solid #00f3ff55; padding: 10px; margin-bottom: 10px; border-radius: 4px; }
        .mail-card div { font-size: 12px; margin-bottom: 6px; word-break: break-all; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ CEOTIGU CLOUD DASHBOARD</h1>
        <div>
            <button class="btn" onclick="addMail()">+ TẠO MAIL</button>
            <button class="btn" onclick="openVMOS()">MỞ VMOS</button>
        </div>
    </header>

    <div class="main">
        <div class="sidebar">
            <h3 style="margin-bottom: 10px; font-size: 14px;">DANH SÁCH EMAIL</h3>
            <div id="mailList"></div>
        </div>
        <div class="content">
            <iframe id="viewFrame" src="https://tmailor.com/vi"></iframe>
        </div>
    </div>

    <script>
        let mails = JSON.parse(localStorage.getItem('ceotigu_list')) || ['ceotigucloud1@tmailor.com'];

        function render() {
            const list = document.getElementById('mailList');
            list.innerHTML = '';
            mails.forEach((m, i) => {
                list.innerHTML += `
                    <div class="mail-card">
                        <div><b>#${i + 1}:</b> ${m}</div>
                        <button class="btn" style="font-size:10px; padding:2px 6px;" onclick="copyText('${m}')">COPY</button>
                    </div>`;
            });
            localStorage.setItem('ceotigu_list', JSON.stringify(mails));
        }

        function addMail() {
            mails.push(`ceotigucloud${mails.length + 1}@tmailor.com`);
            render();
        }

        function copyText(txt) {
            navigator.clipboard.writeText(txt);
            alert('Đã copy: ' + txt);
        }

        function openVMOS() {
            document.getElementById('viewFrame').src = 'https://cloud.vmos.com';
        }

        render();
    </script>
</body>
</html>
