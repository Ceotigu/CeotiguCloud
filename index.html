<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CEOTIGU CLOUD - CYBERPUNK DASHBOARD</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030712;
            --neon-blue: #00f3ff;
            --neon-purple: #bc13fe;
            --neon-pink: #ff0055;
            --dark-panel: rgba(10, 15, 30, 0.85);
            --border-glow: 0 0 10px rgba(0, 243, 255, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Rajdhani', sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(188, 19, 254, 0.15) 0%, transparent 80%),
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }

        /* Top Bar Navigation */
        .top-bar {
            height: 60px;
            background: rgba(5, 8, 22, 0.9);
            border-bottom: 2px solid var(--neon-blue);
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 100;
            position: relative;
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 22px;
            font-weight: 900;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-badge {
            font-size: 10px;
            background: var(--neon-purple);
            color: #fff;
            padding: 2px 6px;
            border-radius: 4px;
            text-shadow: none;
        }

        .nav-controls {
            display: flex;
            gap: 15px;
        }

        .cyber-btn {
            background: transparent;
            border: 1px solid var(--neon-blue);
            color: var(--neon-blue);
            padding: 8px 16px;
            font-family: 'Orbitron', sans-serif;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .cyber-btn:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 15px var(--neon-blue);
        }

        .cyber-btn.purple {
            border-color: var(--neon-purple);
            color: var(--neon-purple);
        }

        .cyber-btn.purple:hover {
            background: var(--neon-purple);
            color: #fff;
            box-shadow: 0 0 15px var(--neon-purple);
        }

        /* Workspace Grid Container */
        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
            height: calc(100vh - 60px);
        }

        .panel {
            background: var(--dark-panel);
            border: 1px solid rgba(0, 243, 255, 0.3);
            border-radius: 8px;
            box-shadow: var(--border-glow);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .panel-header {
            background: rgba(0, 243, 255, 0.1);
            border-bottom: 1px solid rgba(0, 243, 255, 0.3);
            padding: 12px 16px;
            font-family: 'Orbitron', sans-serif;
            font-size: 14px;
            color: var(--neon-blue);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .panel-content {
            padding: 20px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Mail Control Styling */
        .mail-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .mail-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mail-item:hover {
            border-color: var(--neon-purple);
            box-shadow: 0 0 10px rgba(188, 19, 254, 0.3);
        }

        .mail-address {
            font-family: monospace;
            color: var(--neon-blue);
            font-size: 14px;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            border-radius: 4px;
        }

        /* Status Bar */
        .status-dot {
            width: 8px;
            height: 8px;
            background: #00ff66;
            border-radius: 50%;
            box-shadow: 0 0 8px #00ff66;
        }
    </style>
</head>
<body>

    <!-- Top Bar Navigation -->
    <div class="top-bar">
        <div class="logo">
            ⚡ CEOTIGU CLOUD <span class="logo-badge">v2.0 LIVE</span>
        </div>
        <div class="nav-controls">
            <button class="cyber-btn" onclick="createNewMail()">+ TẠO MAIL MỚI</button>
            <button class="cyber-btn purple" onclick="openVMOS()">💻 MỞ VMOS CLOUD</button>
        </div>
    </div>

    <!-- Workspace Grid -->
    <div class="workspace">
        
        <!-- Left Panel: Email Management -->
        <div class="panel">
            <div class="panel-header">
                <span>📧 CẤU HÌNH HÒM THƯ MAIL</span>
                <div style="display:flex; align-items:center; gap:8px;">
                    <div class="status-dot"></div>
                    <span style="font-size: 11px; color: #888;">READY</span>
                </div>
            </div>
            <div class="panel-content">
                <p style="color: #aaa; font-size: 13px;">Danh sách email được tạo sẵn dành cho quản lý session:</p>
                <div class="mail-list" id="mailContainer">
                    <!-- Dynamic Mail List Generated via JS -->
                </div>
            </div>
        </div>

        <!-- Right Panel: Embedded Web View / VMOS -->
        <div class="panel">
            <div class="panel-header">
                <span>🌐 VMOS & ONLINE SESSION VIEW</span>
                <span style="font-size:11px; color: var(--neon-blue);">HTTPS SECURED</span>
            </div>
            <div class="panel-content" style="padding:0;">
                <iframe id="mainViewer" src="https://tmailor.com/vi"></iframe>
            </div>
        </div>

    </div>

    <script>
        // Store created email list in LocalStorage
        let emails = JSON.parse(localStorage.getItem('ceotigu_emails')) || [
            'ceotigucloud1@tmailor.com',
            'ceotigucloud2@tmailor.com'
        ];

        function renderMails() {
            const container = document.getElementById('mailContainer');
            container.innerHTML = '';

            emails.forEach((email, index) => {
                const item = document.createElement('div');
                item.className = 'mail-item';
                item.innerHTML = `
                    <div>
                        <div class="mail-address">${email}</div>
                        <span style="font-size: 11px; color: #666;">ID Session: #${1000 + index}</span>
                    </div>
                    <div style="display:flex; gap:6px;">
                        <button class="cyber-btn" style="padding:4px 8px; font-size:10px;" onclick="copyMail('${email}')">COPY</button>
                        <button class="cyber-btn purple" style="padding:4px 8px; font-size:10px;" onclick="viewMail('${email}')">XEM</button>
                    </div>
                `;
                container.appendChild(item);
            });

            localStorage.setItem('ceotigu_emails', JSON.stringify(emails));
        }

        function createNewMail() {
            const newMail = `ceotigucloud${emails.length + 1}@tmailor.com`;
            emails.push(newMail);
            renderMails();
        }

        function copyMail(text) {
            navigator.clipboard.writeText(text);
            alert('Đã copy email: ' + text);
        }

        function viewMail(email) {
            document.getElementById('mainViewer').src = `https://tmailor.com/vi`;
        }

        function openVMOS() {
            document.getElementById('mainViewer').src = `https://cloud.vmos.com`;
        }

        // Initial Load
        renderMails();
    </script>
</body>
</html>
