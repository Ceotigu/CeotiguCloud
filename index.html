<!DOCTYPE html>
<html lang="vi">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Ceotigu Cloud - Mail.tm API</title>
 <style>
 :root{color-scheme:dark;--g:#00ff88;--bg:#030806;--p:#08150e;--line:#145333} *{box-sizing:border-box} body{margin:0;background:var(--bg);color:#d5ffe4;font:14px Consolas,monospace} button,input{font:inherit} button{background:#071d11;color:var(--g);border:1px solid #17663d;padding:9px 13px;border-radius:5px;cursor:pointer} button:hover{background:#10351f;border-color:var(--g)} input{width:100%;padding:10px;background:#020604;color:var(--g);border:1px solid var(--line);border-radius:5px;outline:none} input:focus{border-color:var(--g)} header{height:65px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid var(--line);background:#040b07;gap:12px} .logo{font-size:20px;font-weight:bold;color:var(--g);text-shadow:0 0 12px #00ff8844} .muted{color:#72a986;font-size:12px} main{max-width:1450px;margin:auto;padding:22px} .row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px} h2{font-size:17px;color:var(--g);font-weight:normal} .primary{border-color:var(--g);background:#07351d} .danger{color:#ff8b8b;border-color:#793c3c} .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px} .card{background:var(--p);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0} .card h3{color:var(--g);margin-top:0} .card p{overflow-wrap:anywhere;color:#a0cdb0} .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px} .empty{grid-column:1/-1;text-align:center;padding:42px 15px;border:1px dashed #205c3a;color:#75a988;border-radius:8px} #auth{position:fixed;inset:0;z-index:1000;background:#020604f5;display:grid;place-items:center;padding:18px} .authbox{width:min(400px,100%);padding:25px;background:#07140c;border:1px solid var(--g);border-radius:10px;box-shadow:0 0 35px #00ff881c} .authbox h1{color:var(--g);font-size:24px} .authbox button{width:100%;margin-top:8px} #message{min-height:20px;margin-top:12px;color:#ffb86a;overflow-wrap:anywhere;font-size:12px} .hidden{display:none!important} #floats{position:fixed;inset:75px 10px 10px;pointer-events:none;z-index:20} 
 .float{position:absolute;left:20px;top:20px;width:780px;height:520px;min-width:320px;min-height:200px;resize:both;overflow:hidden;pointer-events:auto;background:#06110b;border:1px solid var(--g);border-radius:7px;box-shadow:0 8px 30px #000a;display:flex;flex-direction:column} 
 .floatbar{position:sticky;top:0;background:#0a2918;padding:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--g);cursor:move;user-select:none;flex-shrink:0} .floatbar button{padding:3px 9px} .floatbody{padding:15px;overflow:auto;flex:1;display:flex;flex-direction:column;gap:10px} 
 .mail-list{background:#020604;border:1px solid var(--line);border-radius:5px;padding:10px;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;} 
 .mail-item{background:#07140c;border:1px solid #145333;padding:10px;border-radius:4px;font-size:12px;} 
 footer{text-align:center;padding:24px;color:#47765a;font-size:11px} @media(max-width:600px){header{padding:12px;height:auto;flex-wrap:wrap}main{padding:13px}.float{left:5px;width:calc(100% - 10px);height:420px;}} 
 </style>
</head>
<body>
 <header>
 <div class="logo">CEOTIGU <span style="color:#d5ffe4">CLOUD</span></div>
 <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
 <span id="accountLabel" class="muted">CHƯA ĐĂNG NHẬP</span>
 <button id="logout" class="hidden">Đăng xuất</button>
 </div>
 </header>
 <main>
 <div class="row">
 <div>
 <h2>▸ CLOUD CONTROL PANEL</h2>
 <div class="muted">Quản lý phiên Cloud & Mail.tm API Tự Động</div>
 </div>
 <button id="createBtn" class="primary">＋ Tạo Cloud mới</button>
 </div>
 <div class="row">
 <span id="countLabel" class="muted">0 Cloud</span>
 <button id="closeAll">Đóng tất cả cửa sổ</button>
 </div>
 <section id="workspace" class="grid"></section>
 </main>
 <footer>CEOTIGU CLOUD · MATRIX INTERFACE</footer>
 <div id="floats"></div>
 <div id="auth">
 <div class="authbox">
 <div class="logo">CEOTIGU CLOUD</div>
 <h1 id="authTitle">Đăng nhập</h1>
 <form id="authForm">
 <label for="username">Tên tài khoản</label>
 <input id="username" autocomplete="username" required minlength="3" maxlength="24" placeholder="Tên tài khoản">
 <label for="password">Mật khẩu</label>
 <input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="Ít nhất 6 ký tự">
 <button id="authBtn" class="primary" type="submit">Đăng nhập</button>
 </form>
 <button id="switchAuth" type="button">Chưa có tài khoản? Đăng ký</button>
 <div id="message" role="status"></div>
 <p class="muted">Tài khoản được lưu trên trình duyệt của bạn.</p>
 </div>
 </div>
 <script>
 (function(){
 "use strict";
 const \$ = id => document.getElementById(id);
 const DB_KEY = "ceotigu_cloud_mailtm_native_v1";
 const VMOS_URL = "https://cloud.vmos.com/";
 let db = readDB();
 let user = null;
 let mode = "login";
 let zIndex = 30;
 let winNumber = 0; 

 function readDB(){ try{ const data = JSON.parse(localStorage.getItem(DB_KEY)); if(data && data.users && data.sessions) return data; }catch(e){} return {users:{},sessions:{}}; } 
 function saveDB(){ try{ localStorage.setItem(DB_KEY,JSON.stringify(db)); return true; }catch(e){ showMessage("Không lưu được dữ liệu."); return false; } } 
 function escapeHTML(value){ return String(value ?? "").replace(/[&<>"']/g,function(ch){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"'"}[ch]; }); } 
 function showMessage(message){ \$("message").textContent = message; } 
 function ownerAccount(){ return user === "ceotigu"; } 
 function sessions(){ if(!user) return []; if(!Array.isArray(db.sessions[user])) db.sessions[user] = []; return db.sessions[user]; } 
 
 async function hashPassword(password){ 
 if(window.crypto && crypto.subtle && window.isSecureContext){ 
 const buf = await crypto.subtle.digest("SHA-256",new TextEncoder().encode(password));
 return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join(""); 
 } 
 return "fallback:"+password; 
 } 

 function setAuthVisible(visible){ \$("auth").classList.toggle("hidden",!visible); } 
 function updateHeader(){ \$("accountLabel").textContent = user ? "USER: "+user.toUpperCase()+" · "+(ownerAccount()?"OWNER":"STANDARD") : "CHƯA ĐĂNG NHẬP"; \$("logout").classList.toggle("hidden",!user); } 

 \$("switchAuth").addEventListener("click",function(){ 
 mode = mode === "login" ? "register" : "login"; 
 \$("authTitle").textContent = mode === "login" ? "Đăng nhập" : "Đăng ký"; 
 \$("authBtn").textContent = mode === "login" ? "Đăng nhập" : "Tạo tài khoản"; 
 \$("switchAuth").textContent = mode === "login" ? "Chưa có tài khoản? Đăng ký" : "Đã có tài khoản? Đăng nhập"; 
 \$("password").value = ""; showMessage(""); 
 }); 

 \$("authForm").addEventListener("submit",async function(event){ 
 event.preventDefault(); 
 const name = \$("username").value.trim().toLowerCase(); 
 const password = \$("password").value; 
 if(!/^[a-z0-9_-]{3,24}\$/.test(name)){ showMessage("Tên tài khoản: 3–24 ký tự."); return; } 
 if(password.length < 6){ showMessage("Mật khẩu ít nhất 6 ký tự."); return; } 
 \$("authBtn").disabled = true; showMessage("Đang xử lý..."); 
 try{ 
 const hashed = await hashPassword(password); 
 if(mode === "register"){ 
 if(db.users[name]){ showMessage("Tên tài khoản đã tồn tại."); return; } 
 db.users[name] = {hash:hashed}; db.sessions[name] = []; 
 if(!saveDB()){ delete db.users[name]; delete db.sessions[name]; return; } 
 }else{ 
 const record = db.users[name]; 
 if(!record || record.hash !== hashed){ showMessage("Sai tài khoản hoặc mật khẩu."); return; } 
 } 
 user = name; updateHeader(); setAuthVisible(false); \$("password").value = ""; render(); 
 }catch(error){ showMessage("Đã xảy ra lỗi."); }finally{ \$("authBtn").disabled = false; } 
 }); 

 \$("logout").addEventListener("click",function(){ 
 closeAllWindows(); user = null; updateHeader(); render(); 
 $("username").value = ""; $("password").value = ""; mode = "login"; 
 \$("authTitle").textContent = "Đăng nhập"; \$("authBtn").textContent = "Đăng nhập"; 
 \$("switchAuth").textContent = "Chưa có tài khoản? Đăng ký"; setAuthVisible(true); 
 }); 

 function render(){ 
 const list = sessions(); 
 \$("countLabel").textContent = list.length+" Cloud đang hoạt động"+ (ownerAccount()?" · Không giới hạn":" · Tối đa 4 Cloud"); 
 const workspace = \$("workspace"); workspace.replaceChildren(); 
 if(list.length === 0){ 
 workspace.innerHTML = '<div class="empty">Chưa có Cloud nào.<br><br>Nhấn <b>Tạo Cloud mới</b> để bắt đầu.</div>'; 
 return; 
 } 
 list.forEach(function(s){ 
 const card = document.createElement("article"); 
 card.className = "card"; 
 card.innerHTML = ` 
 <h3>▣ ${escapeHTML(s.name)}</h3> 
 <div class="muted">ID: ${escapeHTML(s.id)}</div> 
 <p style="font-size:12px;">Email: <span style="color:var(--g); font-weight:bold;">${escapeHTML(s.email || 'Đang tạo...')}</span></p> 
 <p>Trạng thái: <span style="font-weight:bold; color:${s.status.includes('Đang tắt') ? '#ff8b8b' : '#ffb86a'}">${escapeHTML(s.status)}</span></p> 
 <div class="actions"> 
 <button data-action="email">Hộp Thư API</button> 
 <button data-action="vmos">Open VMOS</button> 
 <button class="danger" data-action="delete">Xóa</button> 
 </div>`; 
 card.querySelectorAll("button").forEach(function(button){ 
 button.addEventListener("click",function(){ 
 const action = button.dataset.action; 
 if(action==="email") openEmailManager(s.id); 
 else if(action==="vmos") openVMOS(s.id); 
 else if(action==="delete") deleteCloud(s.id); 
 }); 
 }); 
 workspace.appendChild(card); 
 }); 
 } 

 // Hàm JavaScript gọi trực tiếp Mail.tm API để lấy email và token
 async function createMailTmAccount() {
 try {
 const domainRes = await fetch('https://api.mail.tm/domains');
 const domainData = await domainRes.json();
 if (!domainData['hydra:member'] || domainData['hydra:member'].length === 0) throw new Error();
 const domain = domainData['hydra:member'][0].domain;
 
 const randomNum = Math.floor(100000 + Math.random() * 900000);
 const email = `ceotigucloud${randomNum}@${domain}`;
 const password = "Pass" + Math.random().toString(36).slice(2, 10);

 const regRes = await fetch('https://api.mail.tm/accounts', {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify({ address: email, password: password })
 });
 if (!regRes.ok) throw new Error();

 const tokenRes = await fetch('https://api.mail.tm/token', {
 method: 'POST',
 headers: { 'Content-Type': 'application/json' },
 body: JSON.stringify({ address: email, password: password })
 });
 const tokenData = await tokenRes.json();
 return { email, token: tokenData.token || '', password };
 } catch(e) {
 const fallbackEmail = `ceotigucloud${Math.floor(100000 + Math.random() * 900000)}@tokmail.net`;
 return { email: fallbackEmail, token: '', password: '' };
 }
 }

 \$("createBtn").addEventListener("click", async function(){ 
 if(!user){setAuthVisible(true);return;} 
 if(!ownerAccount() && sessions().length >= 4){ alert("Tài khoản thường tối đa 4 Cloud."); return; } 
 
 const createBtn = \$("createBtn");
 createBtn.disabled = true; createBtn.textContent = "Đang kết nối Mail.tm API...";

 const id = "CT-"+Date.now().toString(36).toUpperCase()+"-"+Math.random().toString(36).slice(2,6).toUpperCase(); 
 const mailInfo = await createMailTmAccount();

 const s = { 
 id: id, 
 name: "Cloud "+(sessions().length+1), 
 email: mailInfo.email, 
 token: mailInfo.token,
 password: mailInfo.password,
 status: "🤖 Mail.tm API hoạt động",
 messages: [] 
 }; 
 sessions().push(s); 
 saveDB(); 
 render(); 
 openEmailManager(id);

 createBtn.disabled = false; createBtn.textContent = "＋ Tạo Cloud mới";
 }); 

 function getCloud(id){ return sessions().find(s=>s.id===id); } 

 async function openEmailManager(id){ 
 const s = getCloud(id); 
 if(!s) return; 
 s.status = "📥 Hộp thư API đang mở"; 
 saveDB(); 
 render(); 

 const bodyHtml = `
 <div style="display:flex; flex-direction:column; gap:8px;">
 <div style="display:flex; gap:8px; align-items:center;">
 <input id="mail-input-${id}" readonly value="${escapeHTML(s.email)}" style="margin:0; font-size:12px;">
 <button class="primary" style="white-space:nowrap;" onclick="navigator.clipboard.writeText(document.getElementById('mail-input-${id}').value); alert('Đã copy email!');">Copy</button>
 <button onclick="fetchMailMessages('${id}')">🔄 Làm mới</button>
 </div>
 <div class="muted" style="font-size:11px;">Giao diện gọi trực tiếp Mail.tm API bằng JS thuần, tự động nhận thư/OTP.</div>
 </div>
 <div class="mail-list" id="mail-list-${id}">
 <div class="muted" style="text-align:center; margin-top:40px;">Đang quét hộp thư từ API...</div>
 </div>
 `;
 openWindow("HÒM THƯ API · "+s.name, bodyHtml, id);
 fetchMailMessages(id);
 }

 // Hàm JavaScript quét danh sách thư đến từ Mail.tm API
 window.fetchMailMessages = async function(id){
 const s = getCloud(id);
 const container = document.getElementById(`mail-list-${id}`);
 if(!s || !container) return;

 if(!s.token){
 container.innerHTML = '<div class="muted" style="text-align:center; margin-top:30px;">Hòm thư dùng chế độ dự phòng. Hãy copy email sử dụng bình thường.</div>';
 return;
 }

 container.innerHTML = '<div class="muted" style="text-align:center; margin-top:30px;">Đang tải tin nhắn...</div>';

 try {
 const res = await fetch('https://api.mail.tm/messages', {
 headers: { 'Authorization': 'Bearer ' + s.token }
 });
 const data = await res.json();
 const messages = data['hydra:member'] || [];

 if(messages.length === 0){
 container.innerHTML = '<div class="muted" style="text-align:center; margin-top:30px;">Hộp thư trống.<br>Chưa có thư mới gửi đến địa chỉ này.</div>';
 return;
 }

 container.innerHTML = messages.map(m => `
 <div class="mail-item">
 <b>Từ:</b> ${escapeHTML(m.from.address)}<br>
 <b>Tiêu đề:</b> ${escapeHTML(m.subject)}<br>
 <p style="margin:5px 0 0 0; color:#d5ffe4;">${escapeHTML(m.intro)}</p>
 <span class="muted">${new Date(m.createdAt).toLocaleTimeString()}</span>
 </div>
 `).join('');
 } catch(e) {
 container.innerHTML = '<div class="muted" style="text-align:center; margin-top:30px; color:#ff8b8b;">Không thể kết nối đến Mail.tm API.</div>';
 }
 };

 function openVMOS(id){ 
 const s = getCloud(id); 
 if(!s) return; 
 s.status = "📱 Đang chạy máy ảo VMOS"; 
 saveDB(); 
 render(); 
 const body = ` <p style="color:#a0cdb0; margin:0 0 8px 0;">Cloud ID: <b>${escapeHTML(s.id)}</b></p> <iframe src="${VMOS_URL}?cloud_session=${encodeURIComponent(id)}" style="flex:1;width:100%;height:320px;border:2px solid var(--line);background:#fff;border-radius:5px;"></iframe>`; 
 openWindow("VMOS · "+s.name, body, id); 
 } 

 function openWindow(title, html, cloudId){ 
 const box = document.createElement("section"); 
 box.className = "float"; 
 box.style.left = (15+(winNumber*25)%180)+"px"; 
 box.style.top = (15+(winNumber*20)%130)+"px"; 
 box.style.zIndex = ++zIndex; 
 winNumber++; 
 box.innerHTML = ` 
 <div class="floatbar"> 
 <span>${escapeHTML(title)}</span> 
 <span><button type="button" data-min>_</button> <button type="button" data-close>×</button></span> 
 </div> 
 <div class="floatbody">${html}</div>`; 
 \$("floats").appendChild(box); 
 
 const bar = box.querySelector(".floatbar"); 
 const body = box.querySelector(".floatbody"); 
 let drag = null; 
 
 bar.addEventListener("pointerdown",function(event){ 
 if(event.target.closest("button"))return; 
 drag = {x:event.clientX-box.offsetLeft,y:event.clientY-box.offsetTop}; 
 box.style.zIndex = ++zIndex; 
 bar.setPointerCapture(event.pointerId); 
 }); 
 bar.addEventListener("pointermove",function(event){ 
 if(!drag)return; 
 box.style.left = Math.max(0,event.clientX-drag.x)+"px"; 
 box.style.top = Math.max(0,event.clientY-drag.y)+"px"; 
 }); 
 bar.addEventListener("pointerup",()=>{drag=null;}); 
 bar.addEventListener("pointercancel",()=>{drag=null;}); 
 box.addEventListener("pointerdown",()=>{box.style.zIndex=++zIndex;}); 
 
 box.querySelector("[data-close]").addEventListener("click",function(){ 
 box.remove(); 
 if(cloudId) { 
 const targetCloud = getCloud(cloudId); 
 if(targetCloud) { targetCloud.status = "❌ Đang tắt (Offline)"; saveDB(); render(); } 
 } 
 }); 
 
 box.querySelector("[data-min]").addEventListener("click",function(){ 
 const minimized = !body.classList.contains("hidden"); 
 body.classList.toggle("hidden",minimized); 
 box.style.height = minimized ? "42px" : "520px"; 
 box.style.resize = minimized ? "none" : "both"; 
 this.textContent = minimized ? "□" : "_"; 
 }); 
 
 return box; 
 } 

 function deleteCloud(id){ 
 if(!confirm("Xóa Cloud này khỏi danh sách?"))return; 
 db.sessions[user] = sessions().filter(s=>s.id!==id); 
 saveDB(); render(); 
 } 

 function closeAllWindows(){ 
 \$("floats").replaceChildren(); 
 sessions().forEach(s => { s.status = "❌ Đang tắt (Offline)"; }); 
 saveDB(); render(); 
 } 

 \$("closeAll").addEventListener("click",closeAllWindows); 
 updateHeader(); render(); 
 })(); 
 </script>
</body>
</html>
